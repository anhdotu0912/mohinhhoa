allow = ["Bash=cd /d/vinAI/P-014/backend && rm -f smoke_mig.db && DATABASE_URL=\"sqlite:///./smoke_mig.db\" .venv/Scripts/python.exe -c \"\nfrom sqlalchemy import inspect\nfrom app.db.init_db import init_db\nfrom app.db.session import engine\ninit_db()\ncols = [c['name'] for c in inspect(engine).get_columns('users')]\nprint('cols after run1:', cols)\nassert 'full_name' in cols\ninit_db()\nprint('idempotent OK')\n\" 2>&1 | grep -v -i warning | tail -4; rm -f smoke_mig.db", "Bash=cd /d/vinAI/P-014/backend && rm -f smoke_old.db && DATABASE_URL=\"sqlite:///./smoke_old.db\" .venv/Scripts/python.exe -c \"\nimport sqlite3\n# simulate an OLD db: users table WITHOUT full_name\ncon = sqlite3.connect('smoke_old.db')\ncon.execute('CREATE TABLE users (id VARCHAR(36) PRIMARY KEY, email VARCHAR(255) UNIQUE, hashed_password VARCHAR(255), role VARCHAR(20), created_at DATETIME)')\ncon.commit(); con.close()\nfrom sqlalchemy import inspect\nfrom app.db.init_db import init_db\nfrom app.db.session import engine\ninit_db()\ncols = [c['name'] for c in inspect(engine).get_columns('users')]\nprint('cols after migration:', cols)\nassert 'full_name' in cols, cols\n# idempotent second run\ninit_db()\nprint('ALTER path OK')\n\" 2>&1 | grep -v -i warning | tail -4; rm -f smoke_old.db", "Bash=cd /d/vinAI/P-014/backend && .venv/Scripts/python.exe - <<'PYEOF'\n# Syntax + logic smoke test for the proposed backend additions (no file writes)\ncode = '''\nfrom pydantic import BaseModel, Field\n\nclass MetricsUpdateRequest(BaseModel):\n    weight: float = Field(gt=0, description=\"Cân nặng (kg), phải > 0\")\n    height: float = Field(gt=0, description=\"Chiều cao (cm), phải > 0\")\n\nclass PatientMetricsOut(BaseModel):\n    weight: float\n    height: float\n    bmi: float\n    bmi_category: str\n    updated_at: str\n\ndef _bmi_category(bmi: float) -> str:\n    if bmi < 18.5: return \"Thiếu cân\"\n    if bmi < 23: return \"Bình thường\"\n    if bmi < 25: return \"Thừa cân nhẹ\"\n    return \"Béo phì\"\n\ndef compute_bmi(weight_kg: float, height_cm: float) -> float:\n    h = height_cm / 100.0\n    return round(weight_kg / (h * h), 1)\n\n# validation\ntry:\n    MetricsUpdateRequest(weight=-5, height=170)\n    raise SystemExit(\"FAIL: negative weight accepted\")\nexcept Exception as e:\n    print(\"validate >0 OK:\", type(e).__name__)\n\nreq = MetricsUpdateRequest(weight=72.5, height=170)\nbmi = compute_bmi(req.weight, req.height)\nout = PatientMetricsOut(weight=req.weight, height=req.height, bmi=bmi, bmi_category=_bmi_category(bmi), updated_at=\"12/10/2023\")\nprint(\"OK:\", out.model_dump())\nassert bmi == 25.1, bmi  # 72.5 / 1.7^2 = 25.086...\nassert _bmi_category(bmi) == \"Béo phì\"\nprint(\"BMI + category OK\")\n'''\ncompile(code, \"<backend-snippet>\", \"exec\")\nexec(code)\nPYEOF", "Bash=cd /d/vinAI/P-014/backend && grep -rn \"multipart\\|python-multipart\" requirements*.txt 2>/dev/null; .venv/Scripts/python.exe -c \"import multipart; print('multipart OK')\" 2>&1 | tail -1; ls static 2>/dev/null || echo \"no static dir\"", "Bash=cd /d/vinAI/P-014/backend && grep -n \"fastapi\" requirements.txt && (grep -q python-multipart requirements.txt || echo \"python-multipart>=0.0.9\" >> requirements.txt) && tail -2 requirements.txt", "Bash=cd /d/vinAI/P-014/backend && .venv/Scripts/python.exe -c \"from app.db.session import SessionLocal; from app.models.catalog import Medicine, Allergy, Diagnosis; db=SessionLocal(); print('seed-check:', db.query(Medicine).count(), db.query(Allergy).count(), db.query(Diagnosis).count()); db.close()\"", "Bash=cd /d/vinAI/P-014/backend && .venv/Scripts/python.exe -c \"from app.db.init_db import init_db; init_db(); from app.db.session import SessionLocal; from app.models.profile import Profile; db=SessionLocal(); p=db.query(Profile).filter(Profile.user_id=='demo_patient_1').first(); print('demo_patient_1 ->', p.weight, p.height, p.phone, p.address, p.blood_pressure); db.close()\"", "Bash=cd /d/vinAI/P-014/backend && .venv/Scripts/python.exe -