services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: p014
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-p014}
      POSTGRES_DB: p014
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U p014 -d p014"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # Pass-through từ .env — mặc định trỏ vào service `postgres` ở trên.
      - DATABASE_URL=${DATABASE_URL:-postgresql://p014:p014@postgres:5432/p014}
      - QDRANT_PERSIST_DIR=${QDRANT_PERSIST_DIR:-./qdrant_db}
    volumes:
      - ./backend/data:/app/data
      - ./backend/qdrant_db:/app/qdrant_db
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000}
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  postgres_data:
